name: Update rankings and deploy site

on:
  schedule:
    - cron: "17 2 * * 1"
      timezone: "America/New_York"

  workflow_dispatch:
    inputs:
      refresh_playhub:
        description: "Refresh Play Hub results before deploying"
        required: false
        default: true
        type: boolean

  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "config.json"
      - "data/opt-ins.json"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Refresh Play Hub rankings
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_playhub == true) }}
        run: npm run sync
        env:
          SPEEDWAY_SNAPSHOT_KEY: ${{ secrets.SPEEDWAY_SNAPSHOT_KEY }}

      - name: Rebuild public leaderboard from existing snapshot
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.refresh_playhub != true) }}
        run: npm run publish
        env:
          SPEEDWAY_SNAPSHOT_KEY: ${{ secrets.SPEEDWAY_SNAPSHOT_KEY }}

      - name: Commit public ranking update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/rankings.json data/weekly-meta.json
          if [ -f data/private-weekly.enc ]; then git add data/private-weekly.enc; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Speedway rankings"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
